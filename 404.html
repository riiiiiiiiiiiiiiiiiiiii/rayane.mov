<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    html { background: #000; height: 100%; }
    body { margin: 0; min-height: 100%; color: #fff; font: 700 15px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: auto 1fr; padding: 0 16px; }
    a { color: inherit; text-decoration: none; transition: color 120ms ease; }
    @media (hover: hover) { a:hover { color: rgba(255,255,255,0.55); } }
    .nav { display: flex; justify-content: center; gap: 16px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
    .nav a { display: inline-flex; align-items: center; min-height: 32px; }
    main { display: grid; place-content: center; text-align: center; gap: 12px; padding-bottom: 10vh; }
    main p { margin: 0; color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Site"><a href="/">Rayane</a><a href="/#gallery" data-fr="Galerie">Gallery</a><a href="/#info">Info</a></nav>
  <main>
    <p data-en="There’s nothing at this address." data-fr="Il n’y a rien à cette adresse.">There’s nothing at this address.</p>
    <a href="/" data-en="Back to the reels" data-fr="Retour aux démos">Back to the reels</a>
  </main>
  <script>
    // Show this page in French when the visitor chose French on the main site, or their browser is in French.
    let lang = '';
    try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
    if (!lang) lang = (navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en';
    if (lang === 'fr') { document.documentElement.lang = 'fr'; document.title = 'Page introuvable'; document.querySelectorAll('[data-fr]').forEach((el) => { el.textContent = el.dataset.fr; }); }
  </script>
</body>
</html>
